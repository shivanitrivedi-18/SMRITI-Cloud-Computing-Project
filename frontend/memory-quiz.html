<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMRITI — Memory Cues</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3faf8;color:#16313a}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid #d9e6e4}
header button{border:0;background:#e8f3f1;border-radius:12px;padding:10px 14px;font-size:16px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:18px}
.card{background:#fff;border:1px solid #d9e6e4;border-radius:20px;padding:20px;text-align:center}
.photo{max-width:100%;max-height:260px;border-radius:16px;margin-bottom:10px}
h1{font-size:26px;margin:6px 0}.clue{font-size:20px;margin:8px 0 14px}
.opt{display:block;width:100%;margin:10px 0;padding:18px;font-size:22px;border:2px solid #cfe3df;border-radius:16px;background:#fff;cursor:pointer}
.opt:hover{border-color:#0f766e}.opt.show{background:#e3f4ee;border-color:#0f766e}
.hint{border:0;background:none;color:#0f766e;text-decoration:underline;font-size:17px;cursor:pointer}
.msg{font-size:20px;margin:12px 0;min-height:30px}.next{padding:16px 26px;font-size:20px;border:0;border-radius:14px;background:#0f766e;color:#fff;cursor:pointer;margin-top:8px}
.bar{height:10px;background:#dbe9e6;border-radius:6px;margin:0 0 14px}.bar i{display:block;height:100%;background:#0f766e;border-radius:6px}
.note{font-size:13px;color:#527079;margin-top:14px}a{color:#0f766e}
</style></head>
<body>
<header><button onclick="location.href='/elder.html'" id="back">← Back</button><strong>SMRITI · Memory Cues</strong><button onclick="speakQ()" aria-label="Read aloud">🔊</button></header>
<main><div class="bar"><i id="prog" style="width:0"></i></div><div class="card" id="stage">Loading…</div>
<p class="note" id="note">A gentle activity using memories your family saved. There are no wrong answers — it is not a test or a medical assessment.</p></main>
<script src="/auth.js"></script><script src="/i18n.js"></script><script src="/memory-quiz.js"></script>
<script src="/voice.js"></script><script src="/reminder-alerts.js"></script>
<script src="/nav.js"></script>
</body></html>
